[package]
name = "cloudviz"
version = "0.1.0"
edition = "2021"
description = "Native desktop app for visualizing cloud infrastructure topology. Azure first, provider-extensible."
license = "MIT"

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
